name: Publish tensordev to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = metadata["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          tagged_version = tag[1:] if tag.startswith("v") else tag
          if tagged_version != version:
              raise SystemExit(
                  f"release tag {tag!r} does not match package version {version!r}"
              )
          PY

      - name: Retrieve tested distributions
        uses: actions/download-artifact@v4
        with:
          pattern: tensordev-dists-*
          merge-multiple: true
          path: dist/

      - name: Check release metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python tools/check_distribution.py dist/*
          python - <<'PY'
          import pathlib
          import tomllib
          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = Version(metadata["project"]["version"])
          distributions = pathlib.Path("dist")
          sdists = list(distributions.glob("*.tar.gz"))
          wheels = list(distributions.glob("*.whl"))
          assert len(sdists) == 1 and len(wheels) == 4, (sdists, wheels)
          assert parse_sdist_filename(sdists[0].name) == ("tensordev", version)
          platforms = set()
          for wheel in wheels:
              name, wheel_version, _, tags = parse_wheel_filename(wheel.name)
              assert (name, wheel_version) == ("tensordev", version)
              assert all(tag.interpreter == "py3" and tag.abi == "none" for tag in tags)
              platforms.update(tag.platform for tag in tags)
          assert {
              "any",
              "manylinux_2_28_x86_64",
              "manylinux_2_28_aarch64",
              "macosx_11_0_arm64",
          }.issubset(platforms), platforms
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - quality
      - release-build
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/tensordev/${{ github.event.release.tag_name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
