[build-system]
requires = [
    "scikit-build-core>=0.10",
    "jax==0.10.0",
    "jaxlib==0.10.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "tensordev-native-cpu"
version = "0.1.0"
description = "Optional CPU XLA FFI kernels for TensorDev."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Paul Hager"},
    {name = "Julian Pachschwoell"},
    {name = "Luca Pelizzari"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.10.0,<0.12",
    "jaxlib>=0.10.0,<0.12",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/hagerpa/tensordev"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["src/tensordev_native_cpu"]
wheel.py-api = "py3"
sdist.include = [
    "CMakeLists.txt",
    "cpp/**",
    "src/tensordev_native_cpu/**",
    "tests/**",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
