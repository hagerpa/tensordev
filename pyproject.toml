[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tensordev"
version = "0.1.0"
description = "JAX-based tensor algebra for signatures, Volterra signatures, free developments, and signature kernels."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Paul Hager"},
    {name = "Julian Pachschwoell"},
    {name = "Luca Pelizzari"},
]
keywords = [
    "signature",
    "rough paths",
    "Volterra signature",
    "tensor algebra",
    "JAX",
    "kernel",
    "machine learning",
    "stochastic processes",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.10.0,<0.12",
    "jaxlib>=0.10.0,<0.12",
    "numpy>=1.24",
    "numba>=0.58",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "jaxtyping>=0.2",
]
rough = [
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/hagerpa/tensordev"
Repository = "https://github.com/hagerpa/tensordev"
Issues = "https://github.com/hagerpa/tensordev/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "native"
cmake.version = ">=3.20"
wheel.cmake = false
wheel.packages = ["src/tensordev"]
wheel.py-api = "py3"
sdist.inclusion-mode = "explicit"
sdist.include = [
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "src/tensordev/**/*.py",
    "tests/**/*.py",
    "native/CMakeLists.txt",
    "native/cpp/*.cc",
    "native/src/tensordev_native_cpu/*.py",
    "native/tests/*.py",
    "native/pyproject.toml",
    "native/README.md",
    "native/LICENSE",
    "tools/check_distribution.py",
]
wheel.exclude = [
    "**/.DS_Store",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/*.nbc",
    "**/*.nbi",
]

[[tool.scikit-build.overrides]]
if.env.TENSORDEV_BUILD_NATIVE = true
wheel.cmake = true
build.requires = ["jax==0.10.0", "jaxlib==0.10.0"]
cmake.define.TENSORDEV_NATIVE_PACKAGE_DIR = "tensordev/_native_cpu"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavy: expensive tests, only run with --heavy",
]
